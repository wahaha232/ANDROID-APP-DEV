  <meta name="theme-color" content="#0b1220" />

  <meta property="og:url" content="https://wahaha232.github.io/ANDROID-APP-DEV/gpstracker-web/history.html" />

  <title>歷史紀錄 · GPS Tracker</title>
  <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin />
  <link href="style.css?v=8ec4e0bb" rel="stylesheet" />
  <link href="gt-ui.css?v=e8cc6540" rel="stylesheet" />
  <script defer src="common.js?v=46cd05d5"></script>
  <script defer src="gt-core.js?v=dev20261018"></script>
  <script defer src="gt-data.js?v=d27f43b5"></script>
  <script defer src="gt-nav.js?v=0a18e836"></script>
  <script defer src="history.js?v=dev20261018"></script>
</head>
<body>
  <a class="gt-skip" href="#main">跳到主要內容</a>
  <header>
    <div class="brand">
      <span class="logo" aria-hidden="true">📁</span>
      <div>
        <h1>歷史紀錄</h1>
        <div id="summary" class="summary">載入中…</div>
      </div>
    </div>
    <div class="gt-nav" role="navigation" aria-label="主要導覽"><a href="index.html">首頁</a><a href="history.html" aria-current="page">歷史紀錄</a><a href="explore.html">探索挑戰</a><a href="records.html">紀錄管理</a></div>
  </header>

  <main class="gt-main" id="main" tabindex="-1">
    <noscript><div class="gt-state" style="margin:16px"><h3>請開啟 JavaScript</h3><p>本頁需要 JavaScript 才能顯示活動資料。</p></div></noscript>
    <div class="gt-wrap" style="gap:12px">
      <div class="gt-toolbar" role="search">
        <label class="gt-sr" for="search">搜尋活動</label>
        <input id="search" type="search" placeholder="搜尋日期、類型、標題或備註…" autocomplete="off" />
        <label class="gt-sr" for="deviceFilter">裝置</label>
        <select id="deviceFilter"><option value="">全部裝置</option></select>
        <label class="gt-sr" for="modeFilter">活動類型</label>
        <select id="modeFilter"><option value="">全部類型</option></select>
        <label class="gt-sr" for="sortSel">排序</label>
        <select id="sortSel">
          <option value="date_desc">最新優先</option>
          <option value="date_asc">最舊優先</option>
          <option value="dist_desc">距離最長</option>
          <option value="dur_desc">時間最長</option>
          <option value="steps_desc">步數最多</option>
        </select>
        <div class="gt-seg" role="group" aria-label="檢視方式">
          <button type="button" id="viewCards" aria-pressed="true">活動卡片</button>
          <button type="button" id="viewMap" aria-pressed="false">全部軌跡地圖</button>
        </div>
        <span id="count" class="gt-count" aria-live="polite"></span>
      </div>

      <div id="mapWrap" hidden>
        <div class="gt-allmap" id="allmap" role="region" aria-label="全部軌跡地圖">
          <div class="gt-map-note" id="mapNote">載入中…</div>
        </div>
      </div>

      <div id="list" aria-live="polite"><div class="gt-skel" style="height:240px"></div></div>
    </div>
  </main>
</body>
</html>
