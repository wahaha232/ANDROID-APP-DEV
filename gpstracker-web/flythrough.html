<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GPS Tracker 3D 回放</title>
  <link href="vendor/maplibre-gl.css" rel="stylesheet" />
  <script src="common.js?v=042e6b86"></script>
  <script src="vendor/maplibre-gl.js"></script>
  <style>
    html, body { height: 100%; margin: 0; background: #000; overflow: hidden; color: #eaf0fb;
      font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      -webkit-font-smoothing: antialiased; }
    #map { position: absolute; inset: 0; }
    #hud, #controls { -webkit-backdrop-filter: blur(14px) saturate(140%); backdrop-filter: blur(14px) saturate(140%);
      border: 1px solid rgba(76,141,255,.28); box-shadow: 0 10px 30px rgba(0,0,0,.45); }
    #hud { position: absolute; top: 14px; left: 14px; z-index: 10; background: rgba(9,14,25,.7);
      border-radius: 16px; padding: 12px 16px; min-width: 150px; }
    #hud .big { font-size: 28px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums;
      background: linear-gradient(135deg,#4c8dff,#22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent; }
    #hud .unit { font-size: 12px; opacity: .75; margin-left: 4px; }
    #hud .row { font-size: 13px; margin-top: 5px; font-variant-numeric: tabular-nums; }
    #hud .label { opacity: .6; }
    #controls { position: absolute; left: 14px; right: 14px; bottom: 14px; z-index: 10;
      background: rgba(9,14,25,.78); border-radius: 18px; padding: 12px 16px; }
    #controls .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    #seek { width: 100%; accent-color: #4c8dff; }
    button, a.btn { background: linear-gradient(135deg,#4c8dff,#7a5cff); color: #fff; border: 1px solid transparent; border-radius: 999px;
      padding: 8px 16px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; text-decoration: none;
      box-shadow: 0 4px 14px rgba(76,141,255,.3); transition: filter .15s, transform .15s; }
    button:hover, a.btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    button.secondary { background: #16223a; border: 1px solid #2c3f63; box-shadow: none; }
    button.chip { background: #16223a; border: 1px solid #2c3f63; padding: 6px 12px; box-shadow: none; }
    button.chip.active { background: linear-gradient(135deg,#4c8dff,#7a5cff); border-color: transparent; }
    #back { position: absolute; top: 14px; right: 14px; z-index: 10; }
    #status { position: absolute; top: 50%; left: 0; right: 0; text-align: center; color: #8c9ab3; }
  </style>
</head>
<body>
<div id="map"></div>
<div id="hud">
  <div><span class="big" id="hud-dist">0.00</span><span class="unit">km</span></div>
  <div class="row"><span class="label">速度 </span><span id="hud-speed">0</span> km/h</div>
  <div class="row"><span class="label">高度 </span><span id="hud-alt">--</span> m</div>
</div>
<a class="btn" id="back" href="index.html">← 返回儀表板</a>
<div id="status">載入中…</div>
<div id="controls" style="display:none">
  <input id="seek" type="range" min="0" max="1000" value="0" />
  <div class="row" style="margin-top:8px">
    <button id="play">▶ 播放</button>
    <button class="secondary" id="restart">↺ 重播</button>
    <span id="spdchips"></span>
  </div>
</div>

<script>
(function () {
  "use strict";
  var params = new URLSearchParams(location.search);
  var CONFIG = GPST.resolveConfig();
  var trackId = params.get("track");
  var RAW = CONFIG.dataBase;
  var BASE_TILES = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";
  var DEM_TILES = "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png";
  var BASE_ATTR = "Esri, Maxar, Earthstar Geographics, GIS User Community";
  var DEM_ATTR = "Elevation: Mapzen / AWS Terrain Tiles";
  var SPEEDS = [1, 2, 4, 8, 16];

  var coords = [], hudData = [], cum = [], total = 0;
  var progress = 0, playing = false, speed = 4, lastTs = 0, lastTravel = 0;
  var map = null;

  function $(id) { return document.getElementById(id); }

  map = new maplibregl.Map({
    container: "map",
    style: { version: 8, projection: { type: "globe" }, sky: {},
      sources: {
        base: { type: "raster", tiles: [BASE_TILES], tileSize: 256, attribution: BASE_ATTR },
        dem: { type: "raster-dem", tiles: [DEM_TILES], encoding: "terrarium", tileSize: 256, attribution: DEM_ATTR }
      },
      layers: [
        { id: "base", type: "raster", source: "base" },
        { id: "hillshade", type: "hillshade", source: "dem", paint: { "hillshade-exaggeration": 0.5 } }
      ] },
    center: [121, 23.5], zoom: 1.6, pitch: 0, bearing: 0, antialias: true
  });

  map.on("load", function () {
    map.setTerrain({ source: "dem", exaggeration: 1.3 });
    map.addSource("planned", { type: "geojson", data: emptyLine() });
    map.addLayer({ id: "planned-line", type: "line", source: "planned", layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": "#ffffff", "line-width": 4, "line-opacity": 0.35, "line-dasharray": [2, 2] } });
    map.addSource("traveled", { type: "geojson", data: emptyLine() });
    map.addLayer({ id: "traveled-line", type: "line", source: "traveled", layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": "#00E676", "line-width": 6 } });
    map.addSource("marker", { type: "geojson", data: emptyFC() });
    map.addLayer({ id: "marker-dot", type: "circle", source: "marker", paint: { "circle-radius": 9, "circle-color": "#FF3D00", "circle-stroke-color": "#fff", "circle-stroke-width": 3 } });
    loadTrack();
  });

  function emptyLine() { return { type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: [] } }; }
  function emptyFC() { return { type: "FeatureCollection", features: [] }; }

  function loadTrack() {
    if (!trackId) { $("status").textContent = "缺少 ?track= 參數"; return; }
    fetch(RAW + trackId + ".json", { cache: "no-cache" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (t) {
        var pts = t.points || [];
        coords = pts.map(function (p) { return [p[0], p[1]]; });
        hudData = pts.map(function (p) { return [p[3] || 0, p[2] || 0]; });
        cum = [0]; total = 0;
        for (var i = 1; i < coords.length; i++) { total += hav(coords[i - 1], coords[i]); cum.push(total); }
        map.getSource("planned").setData({ type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: coords } });
        fit();
        applyFrame(true);
        $("status").style.display = "none";
        $("controls").style.display = "";
        buildChips();
        if (coords.length > 1) { playing = true; updatePlayBtn(); lastTs = 0; requestAnimationFrame(tick); }
      })
      .catch(function (e) { $("status").textContent = "讀取失敗：" + e.message; });
  }

  function hav(a, b) {
    var R = 6371000, dLat = (b[1] - a[1]) * Math.PI / 180, dLon = (b[0] - a[0]) * Math.PI / 180;
    var la1 = a[1] * Math.PI / 180, la2 = b[1] * Math.PI / 180;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(la1) * Math.cos(la2) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  }
  function bearing(a, b) {
    var la1 = a[1] * Math.PI / 180, la2 = b[1] * Math.PI / 180, dLon = (b[0] - a[0]) * Math.PI / 180;
    var y = Math.sin(dLon) * Math.cos(la2);
    var x = Math.cos(la1) * Math.sin(la2) - Math.sin(la1) * Math.cos(la2) * Math.cos(dLon);
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  }
  function pointAt(f) {
    if (!coords.length) return null;
    if (coords.length === 1 || total === 0) return { pos: coords[0], bearing: 0, i: 0, t: 0 };
    var target = f * total;
    // 二分搜尋：找出第一個 cum[i] >= target 的 i（cum 為累積距離，遞增）。
    var lo = 1, hi = cum.length - 1;
    while (lo < hi) { var mid = (lo + hi) >> 1; if (cum[mid] < target) lo = mid + 1; else hi = mid; }
    var i = Math.min(lo, coords.length - 1);
    var a = coords[i - 1], b = coords[i], segLen = cum[i] - cum[i - 1];
    var t = segLen > 0 ? (target - cum[i - 1]) / segLen : 0;
    return { pos: [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t], bearing: bearing(a, b), i: i, t: t };
  }
  function lerp(a, b, t) { return a + (b - a) * t; }

  function applyFrame(force) {
    var p = pointAt(progress);
    if (!p) return;
    map.jumpTo({ center: p.pos, bearing: p.bearing, pitch: 60, zoom: 15.2 });
    var now = performance.now();
    if (force || now - lastTravel > 60) {
      lastTravel = now;
      map.getSource("traveled").setData({ type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: coords.slice(0, p.i).concat([p.pos]) } });
      map.getSource("marker").setData({ type: "Feature", geometry: { type: "Point", coordinates: p.pos }, properties: {} });
    }
    $("hud-dist").textContent = ((progress * total) / 1000).toFixed(2);
    var spd = 0, alt = null;
    if (hudData.length >= 2 && p.i >= 1) {
      var s0 = hudData[p.i - 1][0], s1 = hudData[p.i][0], a0 = hudData[p.i - 1][1], a1 = hudData[p.i][1];
      spd = lerp(s0, s1, p.t);
      if (a0 && a1) alt = lerp(a0, a1, p.t);
    }
    $("hud-speed").textContent = Math.round(spd);
    $("hud-alt").textContent = alt === null ? "--" : Math.round(alt);
    $("seek").value = String(Math.round(progress * 1000));
  }

  function tick(ts) {
    if (!playing) return;
    if (!lastTs) lastTs = ts;
    var dt = (ts - lastTs) / 1000; lastTs = ts;
    progress = Math.min(1, progress + dt * 0.035 * speed);
    applyFrame(false);
    if (progress < 1) requestAnimationFrame(tick);
    else { playing = false; updatePlayBtn(); applyFrame(true); }
  }

  function fit() {
    if (coords.length < 2) return;
    var b = new maplibregl.LngLatBounds();
    coords.forEach(function (c) { b.extend(c); });
    map.fitBounds(b, { padding: 70, duration: 0, pitch: 45, bearing: 0 });
  }
  function updatePlayBtn() { $("play").textContent = playing ? "⏸ 暫停" : "▶ 播放"; }

  function buildChips() {
    var box = $("spdchips");
    box.innerHTML = "";
    SPEEDS.forEach(function (s) {
      var b = document.createElement("button");
      b.className = "chip" + (s === speed ? " active" : "");
      b.textContent = s + "×";
      b.onclick = function () {
        speed = s;
        Array.prototype.forEach.call(box.children, function (c) { c.className = "chip"; });
        b.className = "chip active";
      };
      box.appendChild(b);
    });
  }

  $("play").onclick = function () { playing = !playing; updatePlayBtn(); if (playing) { lastTs = 0; requestAnimationFrame(tick); } };
  $("restart").onclick = function () { progress = 0; applyFrame(true); playing = true; updatePlayBtn(); lastTs = 0; requestAnimationFrame(tick); };
  $("seek").addEventListener("input", function () { playing = false; updatePlayBtn(); progress = ($("seek").value / 1000); applyFrame(true); });
})();
</script>
</body>
</html>
