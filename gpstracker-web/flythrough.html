<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050912" />
  <title>3D 路線工作區 · GPS Tracker</title>
  <!-- 提前與圖磚主機建立連線（DNS + TLS），省下首批圖磚請求的握手時間 -->
  <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin />
  <link rel="preconnect" href="https://s3.amazonaws.com" crossorigin />
  <link rel="preload" href="vendor/maplibre-gl.js" as="script" />
  <link href="vendor/maplibre-gl.css" rel="stylesheet" />
  <link href="style.css?v=1ceea449" rel="stylesheet" />
  <link href="gt-ui.css?v=f34955b6" rel="stylesheet" />
  <link href="workspace.css?v=c78223bc" rel="stylesheet" />
  <!-- 小型同源腳本不 defer：軌跡 JSON 在頁面一解析就開始下載，與 1 MB 的 MapLibre 並行（沿用原本的載入策略）。 -->
  <script src="common.js?v=46cd05d5"></script>
  <script src="gt-core.js?v=a62ecf03"></script>
  <script src="gt-metro.js?v=3f685dd8"></script>
  <script src="gt-data.js?v=8a4c1c06"></script>
  <script>
    (function () {
      var id = new URLSearchParams(location.search).get("track");
      if (id) GT.loadTrack(id).catch(function () { /* 錯誤由 workspace.js 顯示 */ });
    })();
  </script>
  <script defer src="vendor/maplibre-gl.js"></script>
  <script defer src="gt-profile.js?v=db85fdec"></script>
  <script defer src="workspace.js?v=fdc627f0"></script>
</head>
<body class="ws" data-mode="replay">
<div class="ws-app" id="app">

  <div class="ws-stage" id="stage">
    <div id="map" aria-label="3D 地形地圖"></div>
    <div id="status" class="ws-status" role="status">載入中…</div>

    <div class="ws-topbar">
      <a class="ws-btn" id="back" href="history.html" aria-label="返回活動故事">←<span class="ws-lbl"> 活動故事</span></a>
      <div class="ws-modes" role="tablist" aria-label="檢視模式">
        <button type="button" role="tab" data-mode="explore" aria-selected="false">自由探索</button>
        <button type="button" role="tab" data-mode="replay" aria-selected="true">旅程回放</button>
        <button type="button" role="tab" data-mode="data" aria-selected="false">活動數據</button>
      </div>
      <button type="button" class="ws-btn ws-panel-toggle" id="panelToggle" aria-expanded="true" aria-controls="panel" title="收合／展開資訊面板">☰<span class="ws-lbl"> 資訊</span></button>
    </div>

    <div class="ws-hud" id="hud" aria-hidden="true">
      <div><span class="big" id="hud-dist">0.00</span><span class="unit">km</span></div>
      <div class="row"><span class="label">速度 </span><span id="hud-speed">0</span> km/h</div>
      <div class="row"><span class="label">高度 </span><span id="hud-alt">--</span> m</div>
      <div class="row hud-gap" id="hud-gap" hidden>GPS 中斷・估算路徑</div>
    </div>

    <div class="ws-hint" id="exploreHint">拖曳旋轉・滾輪／雙指縮放・按住右鍵或雙指上下拖曳傾斜</div>

    <div class="ws-controls" id="controls" hidden>
      <div class="ws-seekrow">
        <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="播放進度" />
        <span class="ws-clock" id="clock">0:00 / 0:00</span>
      </div>
      <div class="ws-row">
        <button type="button" class="ws-play" id="play">▶ 播放</button>
        <button type="button" class="ws-chipbtn" id="restart">↺ 重播</button>
        <div class="ws-chips" id="spdchips" role="group" aria-label="播放速度"></div>
        <div class="ws-cams" role="group" aria-label="鏡頭">
          <button type="button" class="ws-chipbtn" id="camFollow" aria-pressed="true">跟隨</button>
          <button type="button" class="ws-chipbtn" id="camOverview" aria-pressed="false">鳥瞰</button>
        </div>
      </div>
    </div>
  </div>

  <aside class="ws-panel" id="panel" aria-label="活動資訊">
    <div class="ws-sheet" id="sheet">
      <button type="button" class="ws-handle" id="sheetBtn" aria-expanded="false" aria-controls="sheetBody">
        <span class="ws-grip" aria-hidden="true"></span>
        <span class="ws-handle-title" id="hTitle">載入中…</span>
        <span class="ws-handle-sub" id="hSub"></span>
      </button>
      <div class="ws-body" id="sheetBody">
        <div class="ws-head">
          <h1 id="pTitle">載入中…</h1>
          <div class="ws-meta" id="pMeta"></div>
        </div>
        <div class="ws-stats" id="pStats"></div>

        <section class="ws-block" id="blkAlt" hidden>
          <h2>海拔剖面 <small>點選或拖曳可跳到該位置</small></h2>
          <canvas id="profAlt" class="gt-profile"></canvas>
        </section>
        <section class="ws-block data-only" id="blkSpd" hidden>
          <h2>速度剖面 <small>km/h</small></h2>
          <canvas id="profSpd" class="gt-profile"></canvas>
        </section>
        <section class="ws-block data-only" id="blkModes" hidden>
          <h2>移動方式</h2>
          <div class="gt-modes" id="modeBar"></div>
          <ul class="gt-mode-legend" id="modeLegend"></ul>
        </section>
        <section class="ws-block data-only" id="blkPhotos" hidden>
          <h2>拍照點</h2>
          <p class="gt-note" id="photoNote"></p>
        </section>

        <section class="ws-block" id="blkGaps" hidden>
          <h2>GPS 中斷（估算）</h2>
          <div id="gapBody"></div>
        </section>

        <div class="ws-actions">
          <a class="btn gt-btn secondary" id="aStory" href="activity.html">活動故事</a>
          <button type="button" class="btn gt-btn secondary" id="aGpx">⬇ GPX</button>
          <button type="button" class="btn gt-btn secondary" id="aShare">分享連結</button>
          <a class="btn gt-btn secondary" id="aEdit" href="records.html">編輯備註</a>
        </div>
        <button type="button" class="btn gt-btn ws-backmap" id="backToMap">↑ 回到地圖</button>
      </div>
    </div>
  </aside>
</div>
<div class="gt-toast" id="toast" role="status" hidden></div>
</body>
</html>
