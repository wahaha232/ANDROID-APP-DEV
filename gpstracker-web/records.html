  <meta charset="utf-8" />

  <meta property="og:image" content="https://wahaha232.github.io/ANDROID-APP-DEV/gpstracker-web/og-cover.png" />

  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <title>紀錄管理</title>
  <link href="style.css?v=8ec4e0bb" rel="stylesheet" />
  <link href="gt-ui.css?v=dev4" rel="stylesheet" />
  <link href="records.css?v=dev20261018" rel="stylesheet" />
  <script defer src="common.js?v=16aa2b38"></script>
  <script defer src="gt-core.js?v=dev20261018"></script>
  <script defer src="gt-data.js?v=17579721"></script>
  <script defer src="gt-nav.js?v=0a18e836"></script>
</head>
<body>
  <a class="gt-skip" href="#main">跳到主要內容</a>
  <header>
    <div class="brand">
      <span class="logo">📁</span>
      <div>
        <h1>紀錄管理</h1>
        <div id="summary" class="summary">載入中…</div>
      </div>
    </div>
    <div class="rec-header-actions">
      <a class="btn secondary" href="index.html">🏠 回首頁</a>
      <a class="btn secondary" href="challenges.html">🏆 競賽中心</a>
      <a class="btn secondary" href="earth.html">🌍 地球征服</a>
      <a class="btn secondary" href="solar.html">🚀 太陽系征服</a>
      <a class="btn secondary" href="progress.html">📈 全挑戰進度</a>
    </div>
  </header>

  <main class="rec-main" id="main" tabindex="-1">
    <noscript><div class="gt-state" style="margin:16px"><h3>請開啟 JavaScript</h3><p>本頁需要 JavaScript 才能顯示活動資料。</p></div></noscript>
    <div id="statusNote" class="rec-note">載入中…</div>

    <details class="rec-settings" id="settings">
      <summary>⚙️ GitHub 寫入設定（編輯 / 刪除需要；Token 只存在你的瀏覽器）</summary>
      <div class="grid">
        <label>儲存庫 (owner/repo)<input id="cfgRepo" placeholder="wahaha232/ANDROID-APP-DEV" /></label>
        <label>分支<input id="cfgBranch" placeholder="main" /></label>
        <label>資料夾路徑<input id="cfgData" placeholder="gpstracker-web/data" /></label>
        <label>GitHub Token（fine-grained PAT，Contents: Read and write）<input id="cfgToken" type="password" autocomplete="off" placeholder="github_pat_..." /></label>
      </div>
      <label style="display:block;margin-top:8px"><input type="checkbox" id="cfgTokenSession" /> 只在此分頁記住 Token（sessionStorage，關閉分頁即清除；未勾選則長期存在此瀏覽器的 localStorage）</label>
      <div class="btn-row">
        <button class="btn" id="saveCfg">儲存設定</button>
        <button class="btn secondary" id="clearCfg">清除 Token</button>
        <span class="badge-sel" id="cfgState"></span>
      </div>
      <div class="rec-note warn" style="margin-top:10px">⚠️ Token 具備此 repo 的寫入權限，請使用僅限此 repo、Contents: Read and write 的 fine-grained PAT，並勿在公用電腦使用。無 Token 時僅能瀏覽與下載。</div>
    </details>

    <div class="rec-toolbar">
      <input id="search" type="search" placeholder="搜尋日期 / 模式 / 裝置 / 備註…" />
      <select id="deviceFilter"><option value="">全部裝置</option></select>
      <select id="modeFilter"><option value="">全部模式</option></select>
      <select id="sortSel">
        <option value="date_desc">日期（新→舊）</option>
        <option value="date_asc">日期（舊→新）</option>
        <option value="dist_desc">距離（大→小）</option>
        <option value="dur_desc">時間（長→短）</option>
      </select>
      <span class="spacer"></span>
      <button class="btn secondary" id="selectAll">全選</button>
      <button class="btn secondary" id="downloadSel">⬇ 下載選取</button>
      <button class="btn secondary" id="deleteSel">🗑️ 刪除選取</button>
      <button class="btn secondary" id="importGpx">⬆ 匯入 GPX</button>
      <input type="file" id="gpxFile" accept=".gpx,application/gpx+xml,text/xml,application/xml" hidden />
      <button class="btn secondary" id="refresh">🔄 重新整理</button>
      <span class="badge-sel" id="selCount"></span>
    </div>

    <div id="tableWrap"></div>
  </main>

  <script defer src="gt-gpx.js?v=f92801bb"></script>
  <script defer src="records.js?v=dev20261018"></script>
</body>
</html>
