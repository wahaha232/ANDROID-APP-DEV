<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="GPS Tracker 紀錄儀表板：地圖軌跡、統計、速度/海拔圖表、3D 回放與 GPX 匯出。" />
  <meta name="theme-color" content="#0b1220" />
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><text x="0" y="13" font-size="14">🛰️</text></svg>' />
  <title>GPS Tracker 紀錄儀表板</title>
  <!-- 提前與圖磚主機建立連線（DNS + TLS） -->
  <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin />
  <link rel="preconnect" href="https://s3.amazonaws.com" crossorigin />
  <link rel="preload" href="vendor/maplibre-gl.js" as="script" />
  <link href="vendor/maplibre-gl.css" rel="stylesheet" />
  <link href="style.css?v=8f353ed8" rel="stylesheet" />
  <script defer src="common.js?v=d579a5fd"></script>
  <script defer src="vendor/maplibre-gl.js"></script>
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">🛰️</span>
      <div>
        <h1>GPS Tracker 紀錄</h1>
        <div id="summary" class="summary">載入中…</div>
      </div>
    </div>
    <div class="header-actions">
      <label class="toggle"><input type="checkbox" id="showAll" /> 顯示全部軌跡</label>
      <a class="btn secondary" href="challenges.html">🏆 競賽中心</a>
      <a class="btn secondary" href="solar.html">🚀 太陽系征服計畫</a>
      <a class="btn secondary" href="earth.html">🌍 地球征服計畫</a>
      <a class="btn secondary" href="taiwan.html">🇹🇼 台灣征服計畫</a>
      <a class="btn secondary" href="progress.html">📈 全挑戰進度</a>
      <a class="btn secondary" href="records.html">📁 紀錄管理</a>
    </div>
  </header>

  <main>
    <aside id="sidebar">
      <div id="quests" class="quests"></div>
      <div class="filters">
        <input id="search" type="search" placeholder="搜尋日期或模式…" />
        <select id="modeFilter">
          <option value="">全部模式</option>
        </select>
      </div>
      <ul id="trackList"></ul>
      <div id="listEmpty" class="empty">尚無紀錄</div>
    </aside>

    <section id="content">
      <div id="map"></div>
      <div id="detail" class="detail hidden">
        <div class="detail-head">
          <h2 id="detailTitle">—</h2>
          <button id="closeDetail" class="icon-btn">✕</button>
        </div>
        <div id="statGrid" class="stat-grid"></div>
        <div id="detailActions" class="detail-actions"></div>
        <div class="chart-block">
          <div class="chart-title">速度 (km/h)</div>
          <canvas id="speedChart" height="140"></canvas>
        </div>
        <div class="chart-block">
          <div class="chart-title">海拔 (m)</div>
          <canvas id="altChart" height="140"></canvas>
        </div>
        <div id="photoStrip" class="photo-strip"></div>
      </div>
      <div id="hint" class="hint">← 選擇左側紀錄以查看分析，或勾選「顯示全部軌跡」。</div>
    </section>
  </main>

  <script defer src="app.js?v=7b022d91"></script>
</body>
</html>
