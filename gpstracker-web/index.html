<body>
  <a class="gt-skip" href="#main">跳到主要內容</a>
  <header>
    <div class="brand">
      <span class="logo" aria-hidden="true">🛰️</span>
      <div>
        <h1>GPS Tracker</h1>
        <div id="summary" class="summary">載入中…</div>
      </div>
    </div>
    <div class="gt-nav"><a href="history.html">歷史紀錄</a><a href="explore.html">探索挑戰</a><a href="records.html">紀錄管理</a></div>
  </header>

  <main class="gt-main" id="main" tabindex="-1">
    <noscript><div class="gt-state" style="margin:16px"><h3>請開啟 JavaScript</h3><p>本頁需要 JavaScript 才能顯示活動資料。</p></div></noscript>
    <div class="gt-wrap">
      <section id="statsSec" aria-labelledby="stats-h">
        <div class="gt-sec-head"><h2 id="stats-h">累積活動摘要</h2><span id="dataStatus" class="gt-status" aria-live="polite">載入中…</span></div>
        <div id="stats" class="gt-stats"><div class="gt-skel" style="height:90px;grid-column:1/-1"></div></div>
        <p class="gt-note" id="statsNote" hidden></p>
      </section>

      <section id="chSec" aria-labelledby="ch-h">
        <div class="gt-sec-head"><h2 id="ch-h">五大挑戰</h2><a href="progress.html">全挑戰進度表 →</a></div>
        <div id="challenges" class="gt-ch-grid"><div class="gt-skel" style="height:220px"></div></div>
        <p class="gt-note">挑戰進度以累積 GPS 里程換算，屬遊戲化目標，不代表實際抵達該地；所有挑戰共用同一份里程，每筆活動只計一次。Voyager 為探測器的參考距離，你追不上它。</p>
      </section>

      <section aria-labelledby="hero-h">
        <div class="gt-sec-head"><h2 id="hero-h">最近活動</h2></div>
        <div id="hero"><div class="gt-skel" style="height:320px"></div></div>
      </section>

      <section id="timelineSec" aria-labelledby="tl-h" hidden>
        <div class="gt-sec-head"><h2 id="tl-h">活動時間軸</h2><a href="history.html">全部紀錄 →</a></div>
        <ol id="timeline" class="gt-timeline"></ol>
      </section>

      <section aria-labelledby="go-h">
        <div class="gt-sec-head"><h2 id="go-h">繼續探索</h2></div>
        <div class="gt-links">
          <a class="gt-link-card" href="history.html"><b>📁 歷史紀錄</b><span>搜尋、篩選、排序所有活動；也可以把全部軌跡一次疊在地圖上。</span></a>
          <a class="gt-link-card" href="recap.html"><b>📅 活動回顧</b><span>年度與月度的累積里程、與上一期比較、移動方式占比與亮點。</span></a>
          <a class="gt-link-card" href="explore.html"><b>🏆 探索挑戰</b><span>競賽、太陽系／地球／台灣征服計畫與步數環遊里程，看看你走到哪了。</span></a>
        </div>
      </section>
    </div>
