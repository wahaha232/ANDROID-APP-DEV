<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="GPS Tracker：把每一次戶外活動變成一則有 3D 路線的故事。活動總覽、歷史紀錄、探索挑戰。" />
  <meta name="theme-color" content="#0b1220" />
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><text x="0" y="13" font-size="14">🛰️</text></svg>' />
  <title>GPS Tracker 活動總覽</title>
  <script>
    // 舊連結相容：競賽中心等頁面仍以 index.html?track=<id> 指向單筆紀錄 → 轉到新的活動故事頁（保留其餘參數）。
    if (new URLSearchParams(location.search).get("track")) location.replace("activity.html" + location.search);
  </script>
  <link href="style.css?v=1ceea449" rel="stylesheet" />
  <link href="gt-ui.css?v=00fde20f" rel="stylesheet" />
  <script defer src="common.js?v=46cd05d5"></script>
  <script defer src="gt-core.js?v=a62ecf03"></script>
  <script defer src="gt-data.js?v=8a4c1c06"></script>
  <script defer src="gt-nav.js?v=81b7d379"></script>
  <script defer src="home.js?v=44d73ace"></script>
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo" aria-hidden="true">🛰️</span>
      <div>
        <h1>GPS Tracker</h1>
        <div id="summary" class="summary">載入中…</div>
      </div>
    </div>
    <div class="gt-nav"><a href="history.html">歷史紀錄</a><a href="explore.html">探索挑戰</a><a href="records.html">紀錄管理</a></div>
  </header>

  <main class="gt-main" id="main">
    <div class="gt-wrap">
      <section aria-labelledby="hero-h">
        <h2 id="hero-h" class="gt-sr">最近一次活動</h2>
        <div id="hero"><div class="gt-skel" style="height:320px"></div></div>
      </section>

      <section id="statsSec" aria-labelledby="stats-h" hidden>
        <div class="gt-sec-head"><h2 id="stats-h">累積統計</h2></div>
        <div id="stats" class="gt-stats"></div>
      </section>

      <section id="timelineSec" aria-labelledby="tl-h" hidden>
        <div class="gt-sec-head"><h2 id="tl-h">最近活動</h2><a href="history.html">全部紀錄 →</a></div>
        <ol id="timeline" class="gt-timeline"></ol>
      </section>

      <section aria-labelledby="go-h">
        <div class="gt-sec-head"><h2 id="go-h">繼續探索</h2></div>
        <div class="gt-links">
          <a class="gt-link-card" href="history.html"><b>📁 歷史紀錄</b><span>搜尋、篩選、排序所有活動；也可以把全部軌跡一次疊在地圖上。</span></a>
          <a class="gt-link-card" href="explore.html"><b>🏆 探索挑戰</b><span>競賽、太陽系／地球／台灣征服計畫與步數環遊里程，看看你走到哪了。</span></a>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
