<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D Flythrough</title>
  <link href="maplibre/maplibre-gl.css" rel="stylesheet" />
  <script src="maplibre/maplibre-gl.js"></script>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; background: #000; overflow: hidden; }
    #map { position: absolute; inset: 0; }
    #hud {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      background: rgba(10, 15, 25, 0.72); color: #fff;
      border-radius: 12px; padding: 10px 14px;
      font-family: -apple-system, Roboto, "Noto Sans TC", sans-serif;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
      min-width: 132px;
    }
    #hud .big { font-size: 24px; font-weight: 700; line-height: 1.1; }
    #hud .unit { font-size: 12px; opacity: 0.75; margin-left: 3px; }
    #hud .row { font-size: 13px; margin-top: 4px; opacity: 0.95; }
    #hud .label { opacity: 0.6; }
    /* 路線上的圖釘（起點／終點）與照片泡泡，樣式仿 Relive 的 3D 飛越。 */
    .pin-wrap { display: flex; flex-direction: column; align-items: center; pointer-events: none; }
    .pin-label {
      background: #fff; color: #222; font: 700 12px/1 -apple-system, Roboto, "Noto Sans TC", sans-serif;
      padding: 4px 9px; border-radius: 5px; margin-bottom: 5px; box-shadow: 0 2px 6px rgba(0,0,0,0.45);
      white-space: nowrap;
    }
    .pin { width: 30px; height: 40px; position: relative; filter: drop-shadow(0 3px 3px rgba(0,0,0,0.5)); }
    .pin i {
      position: absolute; left: 0; top: 2px; width: 24px; height: 24px; background: var(--c, #FFD400);
      border: 3px solid #fff; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); transform-origin: 50% 50%;
    }
    .pin i::after { content: ""; position: absolute; left: 5px; top: 5px; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
    .photo-bubble {
      width: 54px; height: 54px; border-radius: 50%; border: 3px solid #fff; overflow: hidden; background: #333;
      box-shadow: 0 3px 10px rgba(0,0,0,0.55); transition: width .35s, height .35s, border-width .35s; pointer-events: none;
    }
    .photo-bubble img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-bubble.pop { width: 120px; height: 120px; border-width: 4px; }
  </style>
</head>
<body>
<div id="map"></div>
<div id="hud">
  <div><span class="big" id="hud-dist">0.00</span><span class="unit">km</span></div>
  <div class="row"><span class="label">速度 </span><span id="hud-speed">0</span> km/h</div>
  <div class="row"><span class="label">高度 </span><span id="hud-alt">--</span> m</div>
</div>
<script>
  // 全開源 / 0 元：MapLibre GL JS（BSD-3）＋ 免費衛星圖磚 ＋ AWS Terrarium DEM。
  // 圖磚與 DEM 的 URL 由 Android 端（TileProviderConfig / TerrainProviderConfig）帶入。
  var coords = [];   // [[lon, lat], ...]
  var hudData = [];  // [[speedKmh, altitudeM], ...]
  var cum = [];      // 累積距離（公尺）
  var total = 0;
  var progress = 0;
  var playing = false;
  var speed = 4;
  var lastTs = 0;
  var lastReport = 0;
  var lastTravel = 0;
  var sourcesReady = false;
  var routeAdded = false;

  var map = new maplibregl.Map({
    container: "map",
    style: { version: 8, projection: { type: "globe" }, sky: {}, sources: {}, layers: [] },
    center: [121.0, 23.5],
    zoom: 1.6,
    pitch: 0,
    bearing: 0,
    attributionControl: false,
    antialias: true,
    preserveDrawingBuffer: true
  });

  map.on("load", function () {
    if (window.AndroidBridge && AndroidBridge.onReady) AndroidBridge.onReady();
  });

  function bridge(name, a, b, c) {
    try { if (window.AndroidBridge && AndroidBridge[name]) AndroidBridge[name](a, b, c); } catch (e) {}
  }

  // Android 端呼叫：設定底圖與 DEM 來源。
  function initSources(baseUrl, demUrl, encoding) {
    if (sourcesReady) return;
    sourcesReady = true;
    map.addSource("base", { type: "raster", tiles: [baseUrl], tileSize: 256 });
    map.addLayer({ id: "base", type: "raster", source: "base" });
    map.addSource("dem", { type: "raster-dem", tiles: [demUrl], encoding: encoding, tileSize: 256 });
    map.addLayer({ id: "hillshade", type: "hillshade", source: "dem", paint: { "hillshade-exaggeration": 0.5 } });
    map.setTerrain({ source: "dem", exaggeration: 1.3 });
  }

  function haversine(a, b) {
    var R = 6371000.0;
    var dLat = (b[1] - a[1]) * Math.PI / 180.0;
    var dLon = (b[0] - a[0]) * Math.PI / 180.0;
    var la1 = a[1] * Math.PI / 180.0, la2 = b[1] * Math.PI / 180.0;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(la1) * Math.cos(la2) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  }

  // geoJsonStr: GeoJSON Feature(LineString)；hudJsonStr: [[speedKmh, altitudeM], ...]
  function setRoute(geoJsonStr, hudJsonStr) {
    var feature = JSON.parse(geoJsonStr);
    coords = feature.geometry.coordinates || [];
    hudData = hudJsonStr ? JSON.parse(hudJsonStr) : [];
    cum = [0];
    total = 0;
    for (var i = 1; i < coords.length; i++) {
      total += haversine(coords[i - 1], coords[i]);
      cum.push(total);
    }
    if (!routeAdded && coords.length > 0) {
      routeAdded = true;
      map.addSource("planned", { type: "geojson", data: { type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: coords } } });
      // 整條路線一開始就以較淡的黃色畫出，走過的部分再疊上亮黃色；底下加一條深色描邊讓線在衛星圖上更清楚。
      map.addLayer({
        id: "planned-casing", type: "line", source: "planned",
        layout: { "line-cap": "round", "line-join": "round" },
        paint: { "line-color": "#000000", "line-width": 9, "line-opacity": 0.35, "line-blur": 1.5 }
      });
      map.addLayer({
        id: "planned-line", type: "line", source: "planned",
        layout: { "line-cap": "round", "line-join": "round" },
        paint: { "line-color": "#FFD400", "line-width": 5, "line-opacity": 0.5 }
      });
      map.addSource("traveled", { type: "geojson", data: { type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: [] } } });
      map.addLayer({
        id: "traveled-line", type: "line", source: "traveled",
        layout: { "line-cap": "round", "line-join": "round" },
        paint: { "line-color": "#FFD400", "line-width": 6.5, "line-opacity": 1 }
      });
      map.addSource("marker", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
      map.addLayer({
        id: "marker-dot", type: "circle", source: "marker",
        paint: { "circle-radius": 9, "circle-color": "#FF3D00", "circle-stroke-color": "#ffffff", "circle-stroke-width": 3, "circle-pitch-alignment": "map" }
      });
    } else if (routeAdded) {
      map.getSource("planned").setData({ type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: coords } });
    }
    progress = 0;
    fitView();
    applyFrame(true);
  }

  // ---- 起點／終點圖釘與照片泡泡 ----
  var domMarkers = [];
  var photoItems = [];   // { el, frac }

  function clearMarkers() {
    domMarkers.forEach(function (m) { m.remove(); });
    domMarkers = [];
    photoItems = [];
  }

  function makePin(label, color) {
    var wrap = document.createElement("div");
    wrap.className = "pin-wrap";
    var l = document.createElement("div");
    l.className = "pin-label";
    l.textContent = label;
    var pin = document.createElement("div");
    pin.className = "pin";
    pin.style.setProperty("--c", color);
    pin.appendChild(document.createElement("i"));
    wrap.appendChild(l);
    wrap.appendChild(pin);
    return wrap;
  }

  function nearestFrac(lon, lat) {
    var best = 0, bestD = Infinity;
    for (var i = 0; i < coords.length; i++) {
      var dx = (coords[i][0] - lon) * Math.cos(lat * Math.PI / 180.0), dy = coords[i][1] - lat;
      var d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = i; }
    }
    return total > 0 ? cum[best] / total : 0;
  }

  // photosJsonStr: [{lon, lat, url}]（url 為小尺寸縮圖的 data URL）。需在 setRoute 之後呼叫。
  function setMarkers(photosJsonStr) {
    clearMarkers();
    if (coords.length < 2) return;
    var first = coords[0], last = coords[coords.length - 1];
    domMarkers.push(new maplibregl.Marker({ element: makePin("起點", "#00C853"), anchor: "bottom" }).setLngLat(first).addTo(map));
    domMarkers.push(new maplibregl.Marker({ element: makePin("終點", "#FF3D00"), anchor: "bottom" }).setLngLat(last).addTo(map));
    var photos = photosJsonStr ? JSON.parse(photosJsonStr) : [];
    photos.forEach(function (ph) {
      var el = document.createElement("div");
      el.className = "photo-bubble";
      var img = document.createElement("img");
      img.src = ph.url;
      el.appendChild(img);
      domMarkers.push(new maplibregl.Marker({ element: el, anchor: "center" }).setLngLat([ph.lon, ph.lat]).addTo(map));
      photoItems.push({ el: el, frac: nearestFrac(ph.lon, ph.lat), popped: false });
    });
    updatePhotoPop();
  }

  // 飛越經過某張照片時，把它的泡泡放大一下（前 2%～後 5% 的路程）。
  function updatePhotoPop() {
    for (var i = 0; i < photoItems.length; i++) {
      var it = photoItems[i];
      var on = progress >= it.frac - 0.02 && progress <= it.frac + 0.05;
      if (on !== it.popped) {
        it.popped = on;
        it.el.classList.toggle("pop", on);
        it.el.style.zIndex = on ? 5 : 0;
      }
    }
  }

  function fitView() {
    if (coords.length < 2) return;
    var b = new maplibregl.LngLatBounds();
    for (var i = 0; i < coords.length; i++) b.extend(coords[i]);
    map.fitBounds(b, { padding: 70, duration: 0, pitch: 45, bearing: 0 });
  }

  function bearingBetween(a, b) {
    var la1 = a[1] * Math.PI / 180.0, la2 = b[1] * Math.PI / 180.0;
    var dLon = (b[0] - a[0]) * Math.PI / 180.0;
    var y = Math.sin(dLon) * Math.cos(la2);
    var x = Math.cos(la1) * Math.sin(la2) - Math.sin(la1) * Math.cos(la2) * Math.cos(dLon);
    return (Math.atan2(y, x) * 180.0 / Math.PI + 360.0) % 360.0;
  }

  function pointAt(f) {
    if (coords.length === 0) return null;
    if (coords.length === 1 || total === 0) return { pos: coords[0], bearing: 0, i: 0, t: 0 };
    var target = f * total;
    var i = 1;
    while (i < cum.length && cum[i] < target) i++;
    i = Math.min(i, coords.length - 1);
    var a = coords[i - 1], b = coords[i];
    var segLen = cum[i] - cum[i - 1];
    var t = segLen > 0 ? (target - cum[i - 1]) / segLen : 0;
    var lon = a[0] + (b[0] - a[0]) * t;
    var lat = a[1] + (b[1] - a[1]) * t;
    return { pos: [lon, lat], bearing: bearingBetween(a, b), i: i, t: t };
  }

  function lerp(a, b, t) { return a + (b - a) * t; }

  function updateHud(p) {
    var distKm = (progress * total) / 1000.0;
    document.getElementById("hud-dist").textContent = distKm.toFixed(2);
    var spd = 0, alt = null;
    if (hudData.length >= 2 && p && p.i >= 1) {
      var s0 = hudData[p.i - 1] ? hudData[p.i - 1][0] : 0;
      var s1 = hudData[p.i] ? hudData[p.i][0] : s0;
      spd = lerp(s0, s1, p.t);
      var a0 = hudData[p.i - 1] ? hudData[p.i - 1][1] : null;
      var a1 = hudData[p.i] ? hudData[p.i][1] : a0;
      if (a0 !== null && a1 !== null) alt = lerp(a0, a1, p.t);
    }
    document.getElementById("hud-speed").textContent = Math.round(spd);
    document.getElementById("hud-alt").textContent = alt === null ? "--" : Math.round(alt);
    bridge("onHud", distKm, spd, alt === null ? 0 : alt);
  }

  function updateTraveled(p, force) {
    var now = performance.now();
    if (!force && now - lastTravel < 60) return;
    lastTravel = now;
    if (!routeAdded || !p) return;
    var line = coords.slice(0, p.i).concat([p.pos]);
    map.getSource("traveled").setData({ type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: line } });
    map.getSource("marker").setData({ type: "Feature", geometry: { type: "Point", coordinates: p.pos }, properties: {} });
  }

  function applyFrame(force) {
    var p = pointAt(progress);
    if (!p) return;
    map.jumpTo({ center: p.pos, bearing: p.bearing, pitch: 60, zoom: 15.2 });
    updateTraveled(p, force);
    updateHud(p);
    updatePhotoPop();
  }

  function tick(ts) {
    if (!playing) return;
    if (!lastTs) lastTs = ts;
    var dt = (ts - lastTs) / 1000.0;
    lastTs = ts;
    progress = Math.min(1, progress + dt * 0.035 * speed);
    applyFrame(false);
    if (ts - lastReport > 100) { lastReport = ts; bridge("onProgress", progress); }
    if (progress < 1) {
      requestAnimationFrame(tick);
    } else {
      playing = false;
      applyFrame(true);
      bridge("onProgress", 1.0);
      bridge("onFinished");
    }
  }

  function startFly() {
    if (coords.length < 2) return;
    if (progress >= 1) progress = 0;
    playing = true;
    lastTs = 0;
    requestAnimationFrame(tick);
  }

  function pauseFly() { playing = false; }

  function setSpeed(s) { speed = s; }

  function seek(f) {
    progress = Math.max(0, Math.min(1, f));
    applyFrame(true);
    bridge("onProgress", progress);
  }

  function snapshot() {
    try {
      var url = map.getCanvas().toDataURL("image/png");
      bridge("onSnapshot", url);
    } catch (e) {
      bridge("onSnapshot", "");
    }
  }
</script>
</body>
</html>
