name: Android Release Build (Calculator)

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode keystore
        working-directory: Calculator
        run: |
          echo "${{ secrets.CALC_KEYSTORE_BASE64 }}" | base64 -d > release.jks

      - name: Build signed release AAB + APK
        working-directory: Calculator
        env:
          CALC_KEYSTORE_PATH: ${{ github.workspace }}/Calculator/release.jks
          CALC_KEYSTORE_PASSWORD: ${{ secrets.CALC_KEYSTORE_PASSWORD }}
          CALC_KEY_ALIAS: ${{ secrets.CALC_KEY_ALIAS }}
          CALC_KEY_PASSWORD: ${{ secrets.CALC_KEY_PASSWORD }}
        run: |
          gradle bundleRelease assembleRelease --no-daemon

      - name: Remove decoded keystore
        if: always()
        working-directory: Calculator
        run: rm -f release.jks

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: calculator-release-aab
          path: Calculator/app/build/outputs/bundle/release/app-release.aab

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-release-apk
          path: Calculator/app/build/outputs/apk/release/app-release.apk
