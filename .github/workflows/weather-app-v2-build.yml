name: Android CI Build (Weather App V2)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'WEATHER APP_V2/**'
      - '.github/workflows/weather-app-v2-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: WEATHER APP_V2
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: weather-app-v2-debug-apk
          path: WEATHER APP_V2/app/build/outputs/apk/debug/app-debug.apk
