name: Voyager Sync (NASA/JPL Horizons)

on:
  schedule:
    - cron: "17 3 * * *"   # 每天 03:17 UTC 更新
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Voyager distances from JPL Horizons
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime, os, sys

          AU_KM = 149597870.7

          def horizons_range(cmd, center):
              today = datetime.date.today()
              start = today.isoformat()
              stop = (today + datetime.timedelta(days=1)).isoformat()
              url = ("https://ssd.jpl.nasa.gov/api/horizons.api?format=json"
                     f"&COMMAND='{cmd}'&OBJ_DATA='NO'&MAKE_EPHEM='YES'&EPHEM_TYPE='OBSERVER'"
                     f"&CENTER='{center}'&START_TIME='{start}'&STOP_TIME='{stop}'"
                     "&STEP_SIZE='1d'&QUANTITIES='20'")
              req = urllib.request.Request(url, headers={"User-Agent": "gpstracker-voyager-sync"})
              with urllib.request.urlopen(req, timeout=90) as r:
                  data = json.load(r)
              result = data["result"]
              block = result.split("$$SOE")[1].split("$$EOE")[0].strip()
              line = [l for l in block.splitlines() if l.strip()][0]
              parts = line.split()
              # parts ≈ [YYYY-Mon-DD, HH:MM, delta_AU, deldot]
              return float(parts[2])

          def probe(horizons_id):
              au_sun = horizons_range(horizons_id, "500@10")   # Sun
              au_earth = horizons_range(horizons_id, "500@399")  # Earth geocenter
              return au_sun, au_earth

          v1_sun, v1_earth = probe("-31")
          v2_sun, v2_earth = probe("-32")

          out = {
              "updatedAt": int(datetime.datetime.now(datetime.timezone.utc).timestamp() * 1000),
              "generatedAt": datetime.date.today().isoformat(),
              "source": "NASA/JPL Horizons (https://ssd.jpl.nasa.gov/api/horizons.api)",
              "units": "km",
              "reference": {
                  "fromSun": "CENTER=500@10 (Sun)",
                  "fromEarth": "CENTER=500@399 (Earth geocenter)",
                  "auKm": AU_KM,
                  "note": "delta 由 AU 換算為 km；玩家累積里程為地表移動距離，參考中心不同。"
              },
              "probes": {
                  "voyager1": {"horizonsId": "-31", "fromSunKm": round(v1_sun * AU_KM), "fromEarthKm": round(v1_earth * AU_KM), "au": v1_sun},
                  "voyager2": {"horizonsId": "-32", "fromSunKm": round(v2_sun * AU_KM), "fromEarthKm": round(v2_earth * AU_KM), "au": v2_sun}
              }
          }
          path = "gpstracker-web/data/voyager.json"
          with open(path, "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print("wrote", path, out["probes"])
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gpstracker-web/data/voyager.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "chore: sync Voyager distances from JPL Horizons"
            git push
          fi
