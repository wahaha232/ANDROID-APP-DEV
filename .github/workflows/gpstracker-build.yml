name: GPS Tracker Build

on:
  push:
    branches: [ "main" ]
    paths:
      - 'GPSTracker/**'
      - '.github/workflows/gpstracker-build.yml'
  pull_request:
    paths:
      - 'GPSTracker/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GPSTracker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 直接使用 GitHub runner 內建的 Android SDK，不依賴第三方 setup action（較穩定）。
      - name: Install required Android SDK components
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at $SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f | head -n 1)"
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          if [ -d "$SDK_ROOT" ]; then
            echo "sdk.dir=$SDK_ROOT" > local.properties
          fi
          echo "--- local.properties ---"
          cat local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon --console=plain --stacktrace

      - name: Lint
        run: gradle lintDebug --no-daemon --console=plain

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --console=plain

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpstracker-debug-apk
          path: GPSTracker/app/build/outputs/apk/debug/app-debug.apk
